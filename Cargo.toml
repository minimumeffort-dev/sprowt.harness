[package]
name = "sprowt-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0.0"
dotenvy = "0.15"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
ratatui-textarea = "0.9.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
tar = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
