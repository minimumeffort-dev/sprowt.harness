<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Follow the work. Inspect the evidence. Choose the next action.</title>
  <desc id="desc">Illustrated Sprowt Harness terminal. The left timeline shows implementation and checks passed, with one review issue selected. The right panel shows the issue, evidence and proposed fix. The bottom dock offers Fix review issues and a message composer. This is an example layout, not a live session.</desc>
  <style>
    text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 16px; fill: #e6ebe3; }
    .label { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; }
    .muted { fill: #a1aaa0; }
    .green { fill: #bbd98b; }
    .red { fill: #f18b82; }
    .small { font-size: 14px; }
    .bold { font-weight: 700; }
  </style>
  <rect width="1200" height="700" rx="18" fill="#171c1a"/>
  <text x="36" y="41" class="label">A readable path from request to PR</text>
  <text x="1164" y="40" class="small muted" text-anchor="end">ILLUSTRATED EXAMPLE</text>
  <rect x="24" y="62" width="1152" height="558" rx="10" fill="#252b30" stroke="#59634f"/>
  <text x="48" y="97" class="green bold">sprowt harness</text>
  <text x="260" y="97" class="muted">example-project</text>
  <text x="48" y="132" class="muted">&lt;codemod/&gt;</text>
  <text x="166" y="132">◇ Make tasks searchable</text>
  <line x1="548" y1="157" x2="548" y2="440" stroke="#59634f"/>
  <text x="48" y="179" class="green bold">Timeline</text>
  <text x="522" y="179" class="small muted" text-anchor="end">ctrl+l Current</text>
  <line x1="54" y1="205" x2="54" y2="421" stroke="#59634f"/>
  <text x="48" y="218" class="green">✓</text>
  <text x="76" y="218">Plan ready · 2 tasks</text>
  <text x="48" y="261" class="green">✓</text>
  <text x="76" y="261">Implementation · 2/2 finished</text>
  <text x="48" y="304" class="green">✓</text>
  <text x="76" y="304">Combined checks · 3/3 passed</text>
  <rect x="42" y="326" width="491" height="32" fill="#3e4937"/>
  <text x="48" y="347" class="red bold">!</text>
  <text x="76" y="347" class="bold">Review · 1 open issue</text>
  <text x="76" y="379" class="small green">ctrl+g → x  Fix review issues</text>
  <text x="48" y="420" class="muted">○</text>
  <text x="76" y="420" class="muted">Publish PR · after clean review</text>
  <text x="574" y="179" class="green bold">Details</text>
  <rect x="574" y="200" width="38" height="25" rx="3" fill="#3e4937"/>
  <text x="582" y="218" class="small green bold">R1</text>
  <text x="626" y="218" class="bold">Keep focus when results change</text>
  <text x="574" y="247" class="small muted">P2 · interface · Confirmed</text>
  <text x="574" y="286" class="green bold">Evidence</text>
  <text x="590" y="313">Reordering results closes the icon picker</text>
  <text x="590" y="338">and loses the focused option.</text>
  <text x="574" y="380" class="green bold">Proposed fix</text>
  <text x="590" y="407">Preserve picker focus during reordering.</text>
  <text x="590" y="432">Add a regression for delayed results.</text>
  <rect x="42" y="459" width="1116" height="145" rx="5" fill="none" stroke="#8fa366"/>
  <text x="57" y="487" class="red">! Review · 1 open issue</text>
  <text x="57" y="513" class="small muted">Implementation finished · Checks 3/3 passed</text>
  <rect x="824" y="473" width="317" height="28" rx="3" fill="#3e4937"/>
  <text x="835" y="493" class="small green bold">ctrl+g → x  Fix review issues</text>
  <line x1="42" y1="529" x2="1158" y2="529" stroke="#59634f"/>
  <text x="57" y="555" class="muted">Add an instruction…</text>
  <text x="57" y="589" class="small muted">↵ Request edits   ctrl+j Newline</text>
  <text x="1141" y="589" class="small muted" text-anchor="end">ctrl+t Details   ctrl+g More</text>
  <circle cx="48" cy="659" r="15" fill="#3e4937"/><text x="43" y="665" class="green bold">1</text>
  <text x="76" y="665" class="label">Follow the work</text>
  <circle cx="421" cy="659" r="15" fill="#3e4937"/><text x="416" y="665" class="green bold">2</text>
  <text x="449" y="665" class="label">Inspect the evidence</text>
  <circle cx="820" cy="659" r="15" fill="#3e4937"/><text x="815" y="665" class="green bold">3</text>
  <text x="848" y="665" class="label">Choose the next action</text>
</svg>
